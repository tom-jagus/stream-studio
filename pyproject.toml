[project]
name = "stream-studio"
version = "0.1.0"
description = "Local OBS topic presentation and controls"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
stream = "stream_studio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stream_studio = ["web/*.html", "web/*.css", "web/*.js"]
