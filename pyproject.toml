[project]
name = "stream-studio"
version = "0.1.0"
description = "Local OBS topic presentation and controls"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
keys = ["evdev>=1.9,<2", "xkbcommon>=1.5,<2"]
chat = ["grpcio>=1.60,<2", "protobuf>=5,<7"]

[project.scripts]
stream = "stream_studio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stream_studio = ["web/*.html", "web/*.css", "web/*.js"]
